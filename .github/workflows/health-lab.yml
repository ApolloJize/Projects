name: health-lab checks
on:
  push:
    paths: ['azure-oci-health-lab/**', '.github/workflows/health-lab.yml']
  pull_request:
    paths: ['azure-oci-health-lab/**', '.github/workflows/health-lab.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure-oci-health-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m healthlab.demo
      - run: python -m compileall -q healthlab scripts
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=identity init -backend=false -input=false
      - run: terraform -chdir=identity validate
