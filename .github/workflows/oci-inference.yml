name: OCI inference checks
on:
  push:
    paths: ['oci-genai-inference/**', '.github/workflows/oci-inference.yml']
  pull_request:
    paths: ['oci-genai-inference/**', '.github/workflows/oci-inference.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oci-genai-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m inference --question "Which ward had the most outreach visits?"
      - run: python evaluate.py
      - run: python -m compileall -q inference evaluate.py
